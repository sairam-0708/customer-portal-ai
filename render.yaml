# render.yaml — Render blueprint for this repository
# Updated to use Render's `services` format and match the project's Vite build output.

version: 1

services:
  - type: static_site
    name: customer-portal-ai
    repo: https://github.com/sairam-0708/customer-portal-ai
    branch: main
    env: static
    # Vite build command from package.json
    buildCommand: npm run build
    # Vite outputs to `dist` by default
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true

    # Environment variables (optional)
    envVars:
      - key: NODE_ENV
        value: production

# Notes:
# 1) Render expects `services:` with entries having `type: static_site` for static sites.
#    Using `static_sites:` at the top level causes the error you saw in the dashboard.
# 2) I set buildCommand to `npm run build` and staticPublishPath to `dist` because this
#    repository uses Vite (see package.json) which produces the production output in `dist`.
# 3) To apply the security headers and the SPA rewrite, add these files to the repository root:
#    _headers
#      /*
#        X-Content-Type-Options: nosniff
#        Referrer-Policy: strict-origin-when-cross-origin
#        X-Frame-Options: SAMEORIGIN
#    _redirects
#      /*    /index.html   200
# If you want I can create those two files for you and/or merge this manifest into `main`.
